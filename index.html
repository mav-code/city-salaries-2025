const grid = document.getElementById('grid');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(r) {
  const others = r.others > 0 ? ` (+ ${r.others} other title${r.others > 1 ? 's' : ''})` : '';
  const src = r.sources.length
    ? 'Sources: ' + r.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(', ')
    : esc(r.note);
  return `<article class="card ${r.cat}" data-cat="${r.cat}" aria-labelledby="p${r.n}">
    <div class="num">${r.n}</div>
    <h2 class="path" id="p${r.n}" data-ref="start"><span class="hint">How to start</span><span class="t">${esc(r.path)}</span></h2>
    <div class="title-line" data-ref="title"><span class="hint">Best-paid city job from here</span><span class="t"><span class="title">${esc(r.title)}</span><span class="rest">, ${esc(r.agency)}${others}</span></span></div>
    <div class="pay" data-ref="pay"><span class="hint">Top 2025 pay</span><strong class="t">${esc(r.total)}</strong><span class="t">base ${esc(r.base)}</span></div>
    <div class="sources" data-ref="sources"><span class="hint">Where the requirements come from</span><span class="t">${src}</span></div>
  </article>`;
}
grid.innerHTML = DATA.map(card).join('');
// wrap each run of text in a .g so its colour can follow the sweep
document.querySelectorAll('.ref, .card [data-ref] .t').forEach(root => {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) if (w.currentNode.data.trim()) nodes.push(w.currentNode);
  nodes.forEach(n => { const g = document.createElement('span'); g.className = 'g'; n.replaceWith(g); g.append(n); });
});
const buttons = [...document.querySelectorAll('.filters button')];
const allBtn = buttons.find(b => b.dataset.cat === 'all');
const selected = new Set();
function apply() {
  allBtn.setAttribute('aria-pressed', String(selected.size === 0));
  buttons.forEach(b => { if (b !== allBtn) b.setAttribute('aria-pressed', String(selected.has(b.dataset.cat))); });
  grid.querySelectorAll('.card').forEach(el => { el.hidden = selected.size > 0 && !selected.has(el.dataset.cat); el.classList.remove('annotated'); });
  const first = grid.querySelector('.card:not([hidden])');
  if (first) first.classList.add('annotated');
}
buttons.forEach(b => {
  const c = b.dataset.cat;
  b.querySelector('.count').textContent = c === 'all' ? DATA.length : DATA.filter(r => r.cat === c).length;
  b.addEventListener('click', () => {
    if (c === 'all') selected.clear();
    else if (selected.has(c)) selected.delete(c);
    else selected.add(c);
    apply();
  });
});
apply();
// lay a highlighted element's lines end to end; give each text run its offset and length on that strip
function measure(el) {
  const lines = [...el.getClientRects()];
  if (!lines.length) return;
  let len = 0;
  const starts = lines.map(r => { const s = len; len += r.width; return s; });
  el.style.setProperty('--W', len + 'px');
  el.querySelectorAll('.g').forEach(g => {
    const rs = [...g.getClientRects()];
    if (!rs.length) return;
    const mid = rs[0].top + rs[0].height / 2;
    const i = Math.max(0, lines.findIndex(l => mid >= l.top && mid <= l.bottom));
    g.style.setProperty('--o', starts[i] + rs[0].left - lines[i].left + 'px');
    g.style.setProperty('--w', rs.reduce((n, r) => n + r.width, 0) + 'px');
  });
}
function setHl(ref, on, src) {
  const els = document.querySelectorAll(`.ref[data-ref="${ref}"], .card.annotated [data-ref="${ref}"]`);
  if (on) {
    els.forEach(el => el.matches('.ref') ? measure(el) : el.querySelectorAll('.t').forEach(measure));
    if (src) src.classList.add('now');
    els.forEach(el => el.classList.add('hl'));
  } else {
    els.forEach(el => el.classList.remove('hl'));
    void document.body.offsetWidth; // apply the removal before transitions come back on
    els.forEach(el => el.classList.remove('now'));
  }
}
function refEl(t) {
  return (t && t.closest && t.closest('.ref, .card.annotated [data-ref]')) || null;
}
function refOf(t) {
  const el = refEl(t);
  return el ? el.dataset.ref : null;
}
['mouseover', 'focusin'].forEach(ev => document.addEventListener(ev, e => { const el = refEl(e.target); if (el) setHl(el.dataset.ref, true, el); }));
['mouseout', 'focusout'].forEach(ev => document.addEventListener(ev, e => {
  const r = refOf(e.target);
  if (r && !(e.relatedTarget && refOf(e.relatedTarget) === r)) setHl(r, false);
}));
